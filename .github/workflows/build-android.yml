name: Build Android

# ───────────────────────────────────────────────────────────────
# Android-APK für das Schatzmeister-Portal.
#
# Aufgesetzt am 2026-08-23, weil bis dahin gar kein Workflow existierte —
# `.github/` gab es im Repo nicht.
#
# ⚠️ GitHub-Runner, bewusst. Das Repo ist ÖFFENTLICH, damit sind
# `ubuntu-latest`-Läufe kostenlos und unbegrenzt. Der selbstgehostete
# Runner aus der Vorsitzer-App ist hier absichtlich NICHT übernommen: er
# behält den Signierschlüssel auf der Platte, was dort einen eigenen
# Aufräumschritt nötig macht. Solange dieser Build zwei Minuten dauert,
# lohnt der Aufwand nicht.
#
# ⚠️ arm64-only, wie in der Vorsitzer-App. Dort waren gemessen 98 % des
# APK dreimal dieselbe Bibliothek für drei Architekturen. Der Nachweis-
# Schritt unten prüft das bei JEDEM Lauf nach, statt es zu glauben.
# ───────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # Ein Tag vX.Y.Z baut ebenfalls — dieselbe Datei, damit Release und
    # Alltagsbau nicht auseinanderlaufen können.
    tags: ['v*']
    # Änderungen, die den Build nicht berühren, sollen ihn nicht auslösen.
    # `tools/**` steht bewusst NICHT hier: dort liegt der Erreichbarkeitslauf,
    # eine Änderung daran gehört geprüft.
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter-Version'
        required: false
        default: '3.44.8'

# ⚠️ Alle Aktionen per SHA gepinnt, nicht per Tag. Ein Tag laesst sich
# umhaengen, ein SHA nicht — und die v4-Fassungen liefen auf Node 20, was
# GitHub im ersten Lauf am 23.08.2026 bereits als veraltet meldete.
# Dieselben Fassungen wie in der Vorsitzer-App.

env:
  APP_NAME: schatzmeister
  FLUTTER_VERSION: '3.44.8'

permissions:
  contents: read

# Ein neuer Push auf denselben Zweig bricht den älteren Lauf ab —
# veröffentlicht wird ohnehin nur der neueste Stand.
concurrency:
  group: schatzmeister-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: "🔍 Analyse & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        # Zwei `deprecated_member_use`-Hinweise in jpg2pdf_screen.dart und
        # pdf_manager_screen.dart sind bekannt und bestehen seit vor dieser
        # Datei. `--no-fatal-infos` lässt sie durch, echte Fehler und
        # Warnungen brechen weiterhin ab.
        run: flutter analyze --no-fatal-infos

      - run: flutter test

      # Der Erreichbarkeitslauf. Ohne ihn wächst der tote Code stillschweigend
      # zurück — am 2026-08-23 waren 41 % der Dateien von main.dart aus nicht
      # erreichbar, darunter die Impressumsleiste und der einzige Aufrufer
      # von checkForUpdate().
      - name: Erreichbarkeit prüfen
        run: python3 tools/erreichbarkeit.py

  android:
    name: "🤖 Android APK (arm64)"
    needs: analyse
    # ⚠️ NICHT bei einem gewöhnlichen Push auf main.
    #
    # Wer einen Commit auf main schiebt und ihn danach taggt, löste zwei
    # Läufe für denselben Baum aus — zweimal dasselbe APK, rund sechs
    # Minuten davon umsonst. Gebaut wird deshalb nur dort, wo das Ergebnis
    # auch gebraucht wird:
    #
    #   Pull Request       ja  — beweist vor dem Merge, dass es baut
    #   Tag v*             ja  — daraus entsteht das Release
    #   von Hand           ja  — wenn man ausdrücklich ein APK will
    #   Push auf main      NEIN — der PR hat es schon bewiesen, das Tag
    #                            baut gleich darauf die verbindliche Fassung
    #
    # `analyse` läuft weiterhin bei JEDEM Anlass: Tests und der
    # Erreichbarkeitslauf kosten gut eine Minute und fangen genau das ab,
    # was ein Direkt-Push an main sonst unbemerkt einschleppt.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # ⚠️ Ohne Schlüssel bricht der Build NICHT ab — er signiert dann mit dem
      # Debug-Schlüssel. Grund: als diese Datei entstand, hatte das Repo
      # keinerlei Secrets (`gh secret list` war leer), und ein Workflow, der
      # deswegen rot ist, hilft niemandem. Das APK ist dann aber NUR zum
      # Ausprobieren — ein debug-signiertes APK lässt sich nicht als Update
      # über ein release-signiertes installieren.
      - name: Signierschlüssel entpacken
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signiert=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 fehlt — das APK wird mit dem Debug-Schluessel signiert und ist NICHT verteilbar. Secrets setzen: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          # storeFile ist relativ zu android/app/, key.properties liegt in android/
          # — so liest es android/app/build.gradle.kts (rootProject.file).
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/app/upload-keystore.jks android/key.properties
          echo "signiert=release" >> "$GITHUB_OUTPUT"

      - name: Version aus pubspec.yaml lesen
        id: version
        run: |
          set -euo pipefail
          ZEILE="$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          NAME="${ZEILE%%+*}"
          NUMMER="${ZEILE##*+}"
          # Ohne "+N" in pubspec.yaml wäre NUMMER gleich NAME — dann lieber
          # die Lauf-Nummer als eine Build-Nummer, die wie "1.0.17" aussieht.
          [ "$NUMMER" = "$NAME" ] && NUMMER="${GITHUB_RUN_NUMBER}"
          echo "name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "nummer=$NUMMER" >> "$GITHUB_OUTPUT"
          echo "Version $NAME+$NUMMER"

      - name: APK bauen
        # STARTUP_DIAG_KEY traegt das Secret SCHATZMEISTER_STARTUP_DIAG_KEY.
        # Der Name der Define ist in allen drei Apps gleich, der WERT je App
        # verschieden — so trifft die Rotation der einen die anderen nicht.
        # Fehlt das Secret, ist die Define leer und die App schickt wie
        # bisher keine Kopfzeile; der Server nimmt das vorerst weiter an.
        env:
          STARTUP_DIAG_KEY: ${{ secrets.SCHATZMEISTER_STARTUP_DIAG_KEY }}
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.nummer }}" \
            --dart-define=STARTUP_DIAG_KEY="$STARTUP_DIAG_KEY"

      # Beide Fehlerrichtungen wären sonst unsichtbar: ein APK mit allen drei
      # Architekturen (Ersparnis weg) und, schlimmer, eines ganz OHNE arm64 —
      # das ließe sich auf keinem Gerät installieren, und auffallen würde es
      # erst beim Schatzmeister.
      - name: Nachweis — genau arm64-v8a im APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ABIS="$(unzip -Z1 "$APK" | grep -oE '^lib/[^/]+/' | sed 's|^lib/||;s|/$||' | sort -u)"
          echo "Architekturen: ${ABIS:-(keine)} · Groesse: $(du -h "$APK" | cut -f1)"
          if [ "$ABIS" != "arm64-v8a" ]; then
            printf 'gefunden:\n%s\n' "$ABIS"
            echo "::error::Erwartet genau arm64-v8a — pruefe --target-platform und ndk.abiFilters."
            exit 1
          fi

      - name: APK benennen
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/${APP_NAME}-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/${APP_NAME}.apk"
          ls -lh dist/

      # ⚠️ `if: always()` — der Schlüssel muss auch nach einem Fehlschlag weg.
      - name: Signierschlüssel aus dem Arbeitsverzeichnis entfernen
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          # Fester Name, damit `publish-release` ihn findet. Die Version
          # steht im Dateinamen des APK, nicht im Namen des Artefakts.
          name: android-apk
          path: dist/*.apk
          retention-days: 14

      - name: Zusammenfassung
        run: |
          {
            echo "### Android-APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${{ steps.version.outputs.name }}+${{ steps.version.outputs.nummer }} |"
            echo "| Paket | de.icd360sev.schatzmeister |"
            echo "| Architektur | arm64-v8a |"
            echo "| Signatur | ${{ steps.keystore.outputs.signiert }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.keystore.outputs.signiert }}" = "debug" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ Debug-signiert — zum Ausprobieren, nicht zum Verteilen." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────────────────────
  # APK in ein GitHub-Release stellen
  #
  # ⚠️ WARUM DAS SEIN MUSS: ein Artefakt aus `upload-artifact` ist NICHT
  # öffentlich. Es liegt hinter der GitHub-Anmeldung, kommt nur als ZIP und
  # verfällt nach 14 Tagen. Die Schatzmeisterin kann damit nichts anfangen —
  # sie öffnet einen Link auf dem Telefon und erwartet eine .apk.
  #
  # Ein Release-Asset dagegen ist öffentlich, unbefristet und direkt
  # verlinkbar. Der stabile Name macht
  #   releases/latest/download/schatzmeister.apk
  # zu einer Adresse, die immer auf die neueste Fassung zeigt — genau das,
  # was in `version_schatzmeister.json` als `download_url` stehen kann.
  # ──────────────────────────────────────────────────────────────
  publish-release:
    name: "🚀 Ins GitHub-Release stellen"
    needs: [analyse, android]
    # Nur bei einem Tag vX.Y.Z. Ein Push auf main soll kein Release erzeugen —
    # sonst hiesse „latest" irgendwann ein Zwischenstand.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-apk
          path: dist

      - name: Release anlegen, falls es noch keins gibt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GH_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $GH_REF_NAME besteht bereits."
          else
            gh release create "$GH_REF_NAME" \
              --repo "$GH_REPO" \
              --generate-notes \
              --title "$GH_REF_NAME"
            echo "Release $GH_REF_NAME angelegt."
          fi

      - name: APKs hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --clobber: ein erneuter Lauf desselben Tags ersetzt die Dateien,
          # statt mit "asset already exists" abzubrechen.
          gh release upload "$GH_REF_NAME" dist/*.apk --clobber --repo "$GH_REPO"

      # ──────────────────────────────────────────────────────────────
      # version_schatzmeister.json ALS RELEASE-ASSET
      #
      # ⚠️ Bisher holte die App die Versionsauskunft von
      #   https://icd360sev.icd360s.de/api/version_schatzmeister.php
      # also vom Vereinsserver, hinter Device-Key-Prüfung. Das hatte drei
      # Nachteile: der Server muss laufen, die Datei dort muss von Hand
      # gepflegt werden (sie zeigte monatelang auf ein APK, das es nicht
      # gab), und ein frisch installiertes Gerät hat noch gar keinen
      # Device-Key.
      #
      # Jetzt entsteht die Datei im selben Lauf, der auch das APK baut —
      # Version und Download-Adresse können damit nicht mehr auseinander
      # laufen. Dieselbe Lösung wie in der Vorsitzer-App.
      #
      # Die Hülle {"success": true, …} bleibt, damit update_service.dart die
      # Antwort genauso liest wie die alte PHP-Antwort. Am Client ändert sich
      # nur `versionUrl`.
      # ──────────────────────────────────────────────────────────────
      - name: version_schatzmeister.json erzeugen und hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK="dist/${APP_NAME}.apk"
          [ -f "$APK" ] || { echo "::error::$APK fehlt"; exit 1; }

          # Version aus dem Tag: v1.0.18 -> 1.0.18
          VERSION="${GH_REF_NAME#v}"
          # Build-Nummer aus pubspec.yaml des Tags — die App vergleicht
          # zuerst danach, nicht nach der Zeichenkette.
          #
          # ⚠️ Erst in eine Variable, dann filtern. Die erste Fassung hängte
          # `| grep -m1 …` direkt an `base64 -d`; grep steigt beim ersten
          # Treffer aus, base64 schreibt gegen ein geschlossenes Rohr und
          # meldet "write error: Broken pipe" — mit `pipefail` bricht der
          # ganze Schritt ab. Die Zuweisung liest dagegen bis zum Ende.
          PUBSPEC="$(gh api "repos/${GH_REPO}/contents/pubspec.yaml?ref=${GH_REF_NAME}" \
                      --jq '.content' | base64 -d)"
          BUILD="$(printf '%s\n' "$PUBSPEC" | grep '^version:' | head -1 | sed 's/.*+//')"
          [ -n "$BUILD" ] || { echo "::error::Keine Build-Nummer in pubspec.yaml gefunden"; exit 1; }

          export VERSION BUILD
          export GH_URL="https://github.com/${GH_REPO}/releases/download/${GH_REF_NAME}/${APP_NAME}.apk"
          export SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          export GROESSE="$(du -h "$APK" | cut -f1)"
          export DATUM="$(date -u +%Y-%m-%d)"
          # Release-Notizen als Changelog. `--jq` liefert sie roh; leer ist
          # zulässig, update_service.dart faellt dann auf '' zurueck.
          export CHANGELOG="$(gh release view "$GH_REF_NAME" --repo "$GH_REPO" --json body --jq '.body' 2>/dev/null || echo '')"

          # In Python erzeugt, damit jeder Wert sauber JSON-kodiert wird —
          # ein Anführungszeichen in den Release-Notizen würde eine
          # zusammengebaute Zeichenkette zerreißen.
          python3 - > version_schatzmeister.json <<'PY'
          import json, os
          print(json.dumps({
              'success':      True,
              'version':      os.environ['VERSION'],
              'build_number': int(os.environ['BUILD']),
              'download_url': os.environ['GH_URL'],
              'sha256':       os.environ['SHA256'],
              'changelog':    os.environ['CHANGELOG'],
              'min_version':  None,
              'force_update': False,
              'release_date': os.environ['DATUM'],
              'file_size':    os.environ['GROESSE'],
          }, indent=2, ensure_ascii=False))
          PY

          cat version_schatzmeister.json
          gh release upload "$GH_REF_NAME" version_schatzmeister.json --clobber --repo "$GH_REPO"

          {
            echo "### Release $GH_REF_NAME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`https://github.com/$GH_REPO/releases/latest/download/${APP_NAME}.apk\` |"
            echo "| Manifest | \`https://github.com/$GH_REPO/releases/latest/download/version_schatzmeister.json\` |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo ""
            echo "Beide Adressen zeigen immer auf die neueste Fassung."
          } >> "$GITHUB_STEP_SUMMARY"
